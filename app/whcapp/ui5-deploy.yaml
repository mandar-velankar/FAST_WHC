# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
specVersion: '2.4'
metadata:
  name: com.bayer.tender.whcapp
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
  - name: webide-extension-task-updateManifestJson
    afterTask: replaceVersion
    configuration:
      appFolder: webapp
      destDir: dist
  - name: ui5-task-zipper
    afterTask: generateCachebusterInfo
    configuration:
      archiveName: combayertenderwhcapp
      additionalFiles:
      - xs-app.json
bundles:
    - bundleDefinition:
        name: "com/bayer/tender/whcapp/Component-preload.js"
        defaultFileTypes:
        - ".js"
        - ".json"
        - ".xml"
        - ".html"
        - ".library"
        sections:
          - mode: preload
            filters:
              - com/bayer/tender/whcapp/Component.js
              - com/bayer/tender/whcapp/manifest.json
              - com/bayer/tender/whcapp/webapp/controller/**
              - com/bayer/tender/whcapp/webapp/i18n/**
              - com/bayer/tender/whcapp/webapp/model/**
              - com/bayer/tender/whcapp/webapp/service/**
              - com/bayer/tender/whcapp/webapp/state/**
              - com/bayer/tender/whcapp/webapp/view/**
              - "!com/bayer/tender/whcapp/components/**"
              - "!com/bayer/tender/whcapp/libraries/**"
            resolve: false
            sort: true
      bundleOptions:
        optimize: true
        usePredefineCalls: true
    - bundleDefinition:
        name: "com/bayer/tender/whcapp/libraries/uilib/src/com/bayer/tender/uilib/library-preload.js"
        defaultFileTypes:
        - ".js"
        - ".json"
        - ".xml"
        - ".html"
        - ".library"
        sections:
          - mode: preload
            filters:
              - com/bayer/tender/whcapp/libraries/uilib/src/com/bayer/tender/uilib/library.js
              - com/bayer/tender/whcapp/libraries/uilib/src/com/bayer/tender/uilib/manifest.json
              - com/bayer/tender/whcapp/libraries/uilib/src/com/bayer/tender/uilib/messagebyndle.properties
              - com/bayer/tender/whcapp/libraries/uilib/src/com/bayer/tender/uilib/controllers/**
              - com/bayer/tender/whcapp/libraries/uilib/src/com/bayer/tender/uilib/controls/**
              - com/bayer/tender/whcapp/libraries/uilib/src/com/bayer/tender/uilib/libs/**
              - com/bayer/tender/whcapp/libraries/uilib/src/com/bayer/tender/uilib/objects/**
              - com/bayer/tender/whcapp/libraries/uilib/src/com/bayer/tender/uilib/themes/**
            resolve: false
            sort: true
      bundleOptions:
        optimize: true
        usePredefineCalls: true