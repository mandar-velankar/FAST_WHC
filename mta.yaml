_schema-version: "3.1"
ID: com-bayer-tender-whcapp
description: A simple CAP project.
version: 1.0.0
modules:
- name: com-bayer-tender-whcapp-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: com-bayer-tender-whcapp-db
  - name: uaa_FAST
  - name: com-bayer-tender-whcapp-destination-service
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    memory: 512M
    disk-quota: 512M
    buildpack: nodejs_buildpack
  build-parameters:
    builder: npm-ci
- name: com-bayer-tender-whcapp-deployer
  type: hdb
  path: gen/db
  requires:
  - name: com-bayer-tender-whcapp-db
  parameters:
    buildpack: nodejs_buildpack
- name: com-bayer-tender-whcapp-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: com-bayer-tender-whcapp-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - combayertenderwhcapp.zip
      name: combayertenderwhcapp
      target-path: resources/
- name: combayertenderwhcapp
  type: html5
  path: app/whcapp
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: com-bayer-tender-whcapp-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: com-bayer-tender-whcapp-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: com-bayer-tender-whcapp-html5-srv
    service-plan: app-host
- name: com-bayer-tender-whcapp-destination-service
  type: org.cloudfoundry.managed-service
  requires:
    - name: srv-api
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        subaccount:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            Name: fast-whc-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: com-bayer-tender-whcapp-destination-service
    service-plan: lite
- name: uaa_FAST
  parameters:
    path: ./xs-security.json
    service-plan: application
    service: xsuaa
  type: org.cloudfoundry.managed-service
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npx -p @sap/cds-dk cds build --production
